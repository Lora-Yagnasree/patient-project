services:
  - type: web
    name: projectpatient
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn project.wsgi:application
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: projectpatient
          property: connectionString
databases:
  - name: project3monkeys
    plan: free